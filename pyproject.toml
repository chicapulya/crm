[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "places-census"
version = "1.0.0"
description = "Chisinau places census via Google Places API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "click==8.1.7",
    "shapely==2.0.6",
    "aiosqlite==0.20.0",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "openpyxl",
    "numpy",
    "scipy",
    "rapidfuzz",
]

[project.scripts]
places-census = "places_census.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
